#----------------------------------------------------------------------------------------------------------------
#
#----------------------------------------------------------------------------------------------------------------
name: orna_app
#----------------------------------------------------------------------------------------------------------------
#
#----------------------------------------------------------------------------------------------------------------
services:
  #----------------------------------------------------------------------------------------------------------------
  #
  #----------------------------------------------------------------------------------------------------------------
  orna_services:
    image: ${ORNA_SERVICES_IMAGE}
    hostname: ${HOSTNAME}
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0} 
    stdin_open: true
    tty: true
    runtime: nvidia
    gpus: all
    network_mode: host
    privileged: true
    restart: unless-stopped
    volumes:
      #0
      - type: bind
        source: /dev
        target: /dev
        read_only: false
      #1
      - type: bind
        source: /opt/orna_dir
        target: /opt/orna_dir
        read_only: false
      #2
      - type: bind
        source: ./system_logs
        target: /opt/orna_backend/logs
        read_only: false
  #----------------------------------------------------------------------------------------------------------------
  #
  #----------------------------------------------------------------------------------------------------------------
  orna_ui:
    image:  ${ORNA_UI_IMAGE}
    hostname: ${HOSTNAME}
    ports:
      - "4173:80"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
