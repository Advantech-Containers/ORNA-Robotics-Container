name: orna_app

services:
  # The service entrypoint loads IDE/Qdrant before starting Backend.
  orna_services:
    image: harbor.edgesync.cloud/orna_system/orna_service:x86_64-v0.3.0
    hostname: ${HOSTNAME:-orna-edge}
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      ORNA_AI_MODELS_PATH: /etc/orna/ai_models
      DOCKER_HOST: unix:///host-docker/docker.sock
    stdin_open: true
    tty: true
    runtime: nvidia
    gpus: all
    network_mode: host
    privileged: true
    restart: always
    extra_hosts:
      - "host.docker.orna:127.0.0.1"
    volumes:
      # Preserve the existing model volume and generated TensorRT engines.
      - type: volume
        source: foundationpose_models_v1
        target: /etc/orna/ai_models/.ORNA_AI_MODELS/FoundationPose
      # Keep the host socket outside /run to survive the systemd remount.
      - type: bind
        source: /var/run/docker.sock
        target: /host-docker/docker.sock
      - type: bind
        source: /dev
        target: /dev
        read_only: false
      - type: bind
        source: /opt/orna_dir
        target: /opt/orna_dir
        read_only: false
      - type: bind
        source: ./system_logs
        target: /opt/orna_backend/logs
        read_only: false

  orna_ui:
    image: harbor.edgesync.cloud/orna_system/orna_ui:x86_64-v0.3.0
    hostname: ${HOSTNAME:-orna-edge}
    ports:
      - "4173:80"
    environment:
      - NODE_ENV=production
    restart: always

volumes:
  foundationpose_models_v1: {}